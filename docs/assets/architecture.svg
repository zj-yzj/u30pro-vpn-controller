    <text x="456.5" y="304" text-anchor="middle" font-size="16" fill="#536E80">Stock Android + root</text>
    <text x="743.5" y="307" text-anchor="middle" font-size="16" fill="#536E80">On U30 Pro / 设备内</text>

    <rect x="40" y="385" width="1120" height="337" rx="22" fill="#FFFFFF" stroke="#DDE7ED" stroke-width="1.5"/>
    <text x="64" y="423" font-size="18" font-weight="700" letter-spacing="1" fill="#375D80">CONTROL / 设备本地管理</text>

