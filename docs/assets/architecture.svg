    </g>
    <text x="344" y="487" text-anchor="middle" font-size="16" fill="#536E80">Unix</text>
    <text x="344" y="537" text-anchor="middle" font-size="16" fill="#536E80">socket</text>
    <text x="54" y="759" font-size="18" fill="#536E80">本地 Unix socket 控制 · 复用现有 UFI 认证接口 · Local control, existing UFI integration</text>
  </g>
</svg>
