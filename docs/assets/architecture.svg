<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">U30 Pro VPN Controller — traffic and local control architecture</title>
  <desc id="desc">Wi-Fi client traffic passes through the U30 Pro gateway and the Mihomo process running on that device to the Internet. The native Android app reaches webctl through a local Unix socket and webbridge. The UFI web plugin reaches webctl through the existing UFI authenticated root interface. Webctl uses the Mihomo controller's local Unix socket and gateway control scripts.</desc>
  <defs>
    <marker id="traffic" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#147D72"/>
    </marker>
    <marker id="control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#668099"/>
    </marker>
  </defs>
  <rect width="1200" height="790" rx="24" fill="#F4F8FB"/>
