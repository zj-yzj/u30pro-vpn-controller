    <text x="54" y="108" font-size="22" fill="#526B80">U30 Pro 专用 · 原厂 Android / root 集成 · 独立 Mihomo 核心</text>

    <rect x="40" y="143" width="1120" height="214" rx="22" fill="#FFFFFF" stroke="#DDE7ED" stroke-width="1.5"/>
    <text x="64" y="180" font-size="18" font-weight="700" letter-spacing="1" fill="#147D72">TRAFFIC / 网关转发</text>
