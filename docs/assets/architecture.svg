      <path d="M285 266H338"/>
      <path d="M572 266H625"/>
      <path d="M859 266H912"/>
    </g>
    <g text-anchor="middle" fill="#142C46" font-weight="700" font-size="25">
      <text x="169.5" y="254">Wi-Fi client</text>
      <text x="456.5" y="250">U30 Pro</text>
      <text x="743.5" y="254">Mihomo</text>
