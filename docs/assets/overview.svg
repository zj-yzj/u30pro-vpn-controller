    <circle cx="253" cy="390" r="135" fill="#091522"/>
    <circle cx="253" cy="390" r="125" fill="url(#screen)" stroke="#7891A5" stroke-width="2"/>
    <path d="M231 252h44" fill="none" stroke="#6F8599" stroke-width="4" stroke-linecap="round"/>
    <text x="253" y="303" text-anchor="middle" font-size="18" font-weight="700" fill="#142C46">VPN 控制</text>
    <rect x="169" y="328" width="168" height="47" rx="13" fill="#147D72"/>
    <path d="M194 342v13m-7-10a10 10 0 1 0 14 0" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
