    <text x="60" y="132" font-size="52" font-weight="700" letter-spacing="-1.4" fill="#142C46">U30 Pro VPN Controller</text>
    <text x="62" y="172" font-size="24" fill="#4D647B">原厂 Android / root 环境下的设备端 VPN 管理</text>

