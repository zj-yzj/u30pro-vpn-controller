<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">U30 Pro VPN Controller — a dedicated controller for the U30 Pro</title>
  <desc id="desc">Original technical illustration of a round-screen hotspot, with on-device VPN control, manual node tests and an existing UFI web interface. The device and its screen are illustrations, not a photograph or screenshot.</desc>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22364D"/>
      <stop offset="1" stop-color="#101E30"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF5F8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#F4F8FB"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif">
