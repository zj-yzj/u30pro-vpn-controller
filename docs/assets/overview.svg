    <text x="253" y="622" text-anchor="middle" font-size="19" font-weight="600" fill="#142C46">240 × 240 圆屏 / Round screen</text>
    <text x="253" y="651" text-anchor="middle" font-size="16" fill="#64778A">设备与界面示意 / Device &amp; UI illustration</text>

